[project]
name = "mailboxtollm"
version = "0.4.0"
description = "Upload old email archives, search them semantically, and generate storylines with AI"
authors = [
  { name = "Ola Lundström", email = "ola@allemo.se" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
  "email_reply_parser",
  "networkx",
  "tqdm",
  "sentence-transformers>=2.6",
  "python-dotenv",
  "chromadb>=0.4.24",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.0"]
google = ["google-generativeai>=0.8"]
all-llms = ["anthropic>=0.39", "openai>=1.0", "google-generativeai>=0.8"]
outlook = ["pywin32"]
llama = ["llama-index>=0.10.37"]
ner = ["spacy>=3.5"]
neo4j = ["neo4j>=5.19"]
dev = ["pytest", "httpx"]

[project.scripts]
mailboxtollm = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
