[project]
name = "mailboxtollm"
version = "0.1.0"
description = "Transform MBOX or PST email archives into a knowledge graph and vector store for RAG applications"
authors = [
  { name = "Ola Lundström", email = "ola@allemo.se" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

dependencies = [
  "networkx",
  "faiss-cpu",
  "tqdm",
  "sentence-transformers",
  "email_reply_parser",
  "neo4j",
  "pywin32"
]

[project.scripts]
mailboxtollm = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
